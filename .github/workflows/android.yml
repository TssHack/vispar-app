name: Android builds

# Builds release APKs in two editions, phone/tablet and Android TV, each as a universal APK
# and one APK per CPU architecture, and signs them with the release key from the repository
# secrets VISPAR_KEYSTORE_BASE64 and VISPAR_KEYSTORE_PASSWORD.
#
# - push to main or a pull request: the APKs are kept as a workflow artifact
# - push a v* tag, or run by hand and name a tag: the APKs are also attached to that release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APKs to (leave empty to only keep them as artifacts)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the obsolete 'tools' package, which no
          # longer exists in the SDK repository and fails the install.
          packages: 'platform-tools'

      - name: Check that the tag matches the app version
        if: env.RELEASE_TAG != ''
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VISPAR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VISPAR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              echo "::error::A release needs the VISPAR_KEYSTORE_BASE64 and VISPAR_KEYSTORE_PASSWORD secrets"
              exit 1
            fi
            echo "::warning::Signing secrets are not available; these APKs are signed with a throwaway debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vispar-release.jks"
          echo "VISPAR_KEYSTORE=$RUNNER_TEMP/vispar-release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          VISPAR_KEYSTORE_PASSWORD: ${{ secrets.VISPAR_KEYSTORE_PASSWORD }}
          VISPAR_KEY_ALIAS: ${{ secrets.VISPAR_KEY_ALIAS }}
          VISPAR_KEY_PASSWORD: ${{ secrets.VISPAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -x lint

      - name: Name the files
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          for edition in mobile tv; do
            [ "$edition" = tv ] && prefix=android-tv || prefix=android
            for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
              cp "app/build/outputs/apk/$edition/release/app-$edition-$abi-release.apk" \
                 "out/Vispar-$VERSION-$prefix-$abi.apk"
            done
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - name: Verify the signatures
        env:
          VISPAR_KEYSTORE_PASSWORD: ${{ secrets.VISPAR_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          if [ -n "$VISPAR_KEYSTORE" ]; then
            EXPECTED=$(keytool -list -v -keystore "$VISPAR_KEYSTORE" -storepass:env VISPAR_KEYSTORE_PASSWORD \
              | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          for apk in out/*.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$apk is not signed with the release key"
              exit 1
            fi
            echo "$(basename "$apk")  signer $ACTUAL"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vispar-apks
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: out/*
